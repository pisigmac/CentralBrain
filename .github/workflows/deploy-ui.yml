name: Deploy AgentDrive Docs

on:
  push:
    branches: ["dev", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci
        working-directory: ui

      - name: Build UI
        run: npm run build
        working-directory: ui

      - name: Copy Documentation to UI Data
        run: |
          mkdir -p ui/dist/data
          # Copy the CentralBrain files to the dashboard
          cp README.md ui/dist/data/README.md || true
          cp AGENTS.md ui/dist/data/AGENTS.md || true
          cp master-overview.md ui/dist/data/master-overview.md || true
          cp projects/global-memory.md ui/dist/data/global-memory.md || true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './ui/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
